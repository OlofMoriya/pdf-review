[package]
name = "pdf-review"
version = "0.2.2"
edition = "2024"
description = "A fast PDF reader for reviewing documents: annotate, comment, and work through review lists."
license = "AGPL-3.0-or-later"
repository = "https://github.com/OlofMoriya/pdf-review"

[features]
console = []

[dependencies]
anyhow = "1.0.104"
futures = { version = "0.3", features = ["executor"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = "0.25"
mupdf = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.4"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSImage", "NSResponder", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[dev-dependencies]
resvg = "0.45"
